[workspace.package]
version = "5.3.0-pre.0"
edition = "2021"
rust-version = "1.90.0"
authors = ["The Tari Development Community"]
repository = "https://github.com/tari-project/tari"
license = "BSD-3-Clause"

[workspace]
members = [
    "base_layer/core",
    "base_layer/common_types",
    "base_layer/transaction_components",
    "base_layer/node_components",
    "base_layer/mmr",
    "base_layer/p2p",
    "base_layer/service_framework",
    "base_layer/sidechain",
    "base_layer/wallet",
    "base_layer/wallet_ffi",
    "base_layer/transaction_key_manager",
    "clients/rust/base_node_grpc_client",
    "clients/rust/wallet_grpc_client",
    "comms/core",
    "comms/dht",
    "comms/rpc_macros",
    "common_sqlite",
    "common",
    "common/tari_features",
    "infrastructure/libtor",
    "infrastructure/metrics",
    "infrastructure/jellyfish",
    "infrastructure/shutdown",
    "infrastructure/storage",
    "infrastructure/tari_script",
    "infrastructure/test_utils",
    "buildtools/deps_only",
    "applications/minotari_node",
    "applications/minotari_console_wallet",
    "applications/minotari_app_utilities",
    "applications/minotari_merge_mining_proxy",
    "applications/minotari_miner",
    "applications/minotari_ledger_wallet/comms",
    "applications/minotari_ledger_wallet/common",
    "applications/minotari_utils",
    "applications/minotari_offline_signer",
    "integration_tests",
    "hashing",
]
# Add here until we move to edition=2021
resolver = "2"


[workspace.dependencies]
tari_jellyfish = { version = "5.3.0-pre.0", path = "infrastructure/jellyfish" }
tari_common = { version = "5.3.0-pre.0", path = "common" }
tari_common_sqlite = { version = "5.3.0-pre.0", path = "common_sqlite" }
tari_common_types = { version = "5.3.0-pre.0", path = "base_layer/common_types" }
tari_comms = { version = "5.3.0-pre.0", path = "comms/core" }
tari_comms_dht = { version = "5.3.0-pre.0", path = "comms/dht", default-features = false }
tari_comms_rpc_macros = { version = "5.3.0-pre.0", path = "comms/rpc_macros" }
tari_core = { version = "5.3.0-pre.0", path = "base_layer/core", default-features = false }
tari_features = { version = "5.3.0-pre.0", path = "common/tari_features" }
tari_hashing = { version = "5.3.0-pre.0", path = "hashing" }
tari_libtor = { version = "5.3.0-pre.0", path = "infrastructure/libtor" }
tari_node_components = { version = "5.3.0-pre.0", path = "base_layer/node_components" }
tari_metrics = { version = "5.3.0-pre.0", path = "infrastructure/metrics" }
tari_mmr = { version = "5.3.0-pre.0", path = "base_layer/mmr" }
tari_max_size = { version = "5.3.0-pre.0", path = "infrastructure/max_size" }
tari_p2p = { version = "5.3.0-pre.0", path = "base_layer/p2p" }
tari_script = { version = "5.3.0-pre.0", path = "infrastructure/tari_script" }
tari_service_framework = { version = "5.3.0-pre.0", path = "base_layer/service_framework" }
tari_shutdown = { version = "5.3.0-pre.0", path = "infrastructure/shutdown" }
tari_sidechain = { version = "5.3.0-pre.0", path = "base_layer/sidechain" }
tari_storage = { version = "5.3.0-pre.0", path = "infrastructure/storage" }
tari_transaction_components = { version = "5.3.0-pre.0", path = "base_layer/transaction_components" }
tari_transaction_key_manager = { version = "5.3.0-pre.0", path = "base_layer/transaction_key_manager" }
tari_test_utils = { version = "5.3.0-pre.0", path = "infrastructure/test_utils" }
minotari_app_grpc = { version = "5.3.0-pre.0", path = "applications/minotari_app_grpc" }
minotari_app_utilities = { version = "5.3.0-pre.0", path = "applications/minotari_app_utilities" }
minotari_wallet = { version = "5.3.0-pre.0", path = "base_layer/wallet" }
minotari_node_grpc_client = { version = "5.3.0-pre.0", path = "clients/rust/base_node_grpc_client" }
minotari_node_wallet_client = { version = "5.3.0-pre.0", path = "clients/rust/base_node_wallet_client" }
minotari_console_wallet = { version = "5.3.0-pre.0", path = "applications/minotari_console_wallet" }
minotari_merge_mining_proxy = { version = "5.3.0-pre.0", path = "applications/minotari_merge_mining_proxy" }
minotari_miner = { version = "5.3.0-pre.0", path = "applications/minotari_miner" }
minotari_node = { version = "5.3.0-pre.0", path = "applications/minotari_node" }
minotari_wallet_ffi = { version = "5.3.0-pre.0", path = "base_layer/wallet_ffi" }
minotari_wallet_grpc_client = { version = "5.3.0-pre.0", path = "clients/rust/wallet_grpc_client" }
minotari_ledger_wallet_comms = { version = "5.3.0-pre.0", path = "applications/minotari_ledger_wallet/comms" }
minotari_ledger_wallet_common = { version = "5.3.0-pre.0", path = "applications/minotari_ledger_wallet/common" }
minotari_mcp_common = { version = "5.3.0-pre.0", path = "applications/minotari_mcp_common" }

tari_utilities = { version = "0.8" }
tari_crypto = { version = "0.22.1" }

anyhow = { version = "1.0" }
serde_json = "1"
serde = "1"
rand = { version = "0.8" }
thiserror = { version = "2" }
borsh = { version = "1.5.7" }
tokio = { version = "1.47" }
log = { version = "0.4" }
log4rs = { version = "1.4", default-features = false}
base64 = "0.22"
[profile.release]
# By default, Rust will wrap an integer in release mode instead of throwing the overflow error
# seen in debug mode. Panicking at this time is better than silently using the wrong value.
overflow-checks = true
opt-level = 3
debug = false
# To enable debug symbols with dhat profiling in release mode, enable the 'dhat-heap' feature and use
# CARGO_PROFILE_* Environment Variables:
#   CARGO_PROFILE_RELEASE_DEBUG=true cargo build --release --features=dhat-heap               ...(Linux)
#   $env:CARGO_PROFILE_RELEASE_DEBUG = "true"; cargo build --release --features=dhat-heap     ...(PowerShell)

[patch.crates-io]
liblmdb-sys = { git = "https://github.com/tari-project/lmdb-rs", tag = "0.7.6-tari.1" }
