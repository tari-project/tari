[package]
name = "tari_hashing"
description = "Tari hash domains"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tari_crypto = { workspace = true, features = ["borsh"] }
borsh = { workspace = true}
digest = { version = "0.10" }
blake2 = { version = "0.10", default-features = false }
# `Zeroizing<Output<D>>` needs `GenericArray: Zeroize`
generic-array = { version = "0.14", default-features = false, features = ["zeroize"] }
zeroize = { version = "1", default-features = false }

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

[package.metadata.cargo-machete]
# Only declared to enable its `zeroize` feature (needed for `Zeroizing<Output<D>>`); never named in code.
ignored = ["generic-array"]
