[package]
name = "minotari_wallet_ffi"
description = "Tari cryptocurrency wallet C FFI bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
tari_common = { workspace = true }
tari_common_types = { workspace = true }
tari_comms = { workspace = true, features = ["c_integration"] }
tari_crypto = { workspace = true }
tari_hashing = { workspace = true }
tari_p2p = { workspace = true }
tari_script = { workspace = true }
tari_shutdown = { workspace = true }
tari_utilities = { workspace = true }
tari_transaction_components = { workspace = true}
minotari_wallet = { workspace = true, features = ["c_integration"] }
tari_transaction_key_manager = { workspace = true }

chacha20poly1305 = "0.10.1"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
futures = { version = "^0.3.1", features = ["compat", "std"] }
libc = "0.2.65"
log = { workspace = true }
log4rs = { workspace = true, features = [
    "default",
    "console_appender",
    "file_appender",
    "yaml_format",
] }
rand = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
num-traits = "0.2.15"
itertools = "0.10.3"
zeroize = "1"
serde_json = { workspace = true }

[target.'cfg(target_os="android")'.dependencies]
openssl = { version = "0.10.80", features = ["vendored"] }

[lib]
crate-type = ["staticlib", "cdylib"]

[dev-dependencies]
tari_transaction_key_manager = { workspace = true }
once_cell = "1.8.0"
tempfile = "3.1.0"
tari_common_types = { workspace = true }
tari_test_utils = { workspace = true }
tari_service_framework = { workspace = true }
borsh = { workspace = true }
env_logger = "0.11"

[build-dependencies]
cbindgen = "0.29"
tari_common = { workspace = true, features = [
    "build",
    "static-application-info",
] }
tari_features = { workspace = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(tari_target_network_mainnet)',
    'cfg(tari_target_network_nextnet)',
    'cfg(tari_target_network_testnet)',
] }
