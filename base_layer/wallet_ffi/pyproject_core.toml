[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tari-wallet-core"
version = "0.1.0"
description = "Core functionality for Tari cryptocurrency wallet Python bindings"
authors = [
    {name = "The Tari Development Community", email = "dev@tari.com"}
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
homepage = "https://tari.com"
repository = "https://github.com/tari-project/tari"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.8"
dependencies = [
    # Core package has no external dependencies
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio>=0.18.0",
]

[project.urls]
"Bug Reports" = "https://github.com/tari-project/tari/issues"
"Source" = "https://github.com/tari-project/tari"
"Documentation" = "https://tari.com/docs"

[tool.setuptools.packages.find]
where = ["python"]
include = ["tari_wallet_core*", "tari_wallet*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt"]
