# Only use lld on Linux where it's commonly available
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[target.aarch64-unknown-linux-gnu]
linker = "clang" 
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# Use system linker on macOS
[target.aarch64-apple-darwin]
rustflags = []

[target.x86_64-apple-darwin]
rustflags = []

[env]
PYTHONPATH = { value = "python", relative = true }

[alias]
dev = "build --features python-bindings"
test-all = "test --features python-bindings"
