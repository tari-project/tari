version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
    rust: "1.70"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

mkdocs:
  configuration: mkdocs.yml
  fail_on_warning: true

python:
  install:
    - requirements: requirements-dev.txt
    - method: pip
      path: .
      extra_requirements:
        - docs

formats:
  - pdf
  - htmlzip

submodules:
  include: []
  exclude: all
