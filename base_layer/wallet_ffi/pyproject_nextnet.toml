[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tari-wallet-nextnet"
version = "0.1.0"
description = "Python bindings for Tari cryptocurrency wallet - Nextnet network"
authors = [
    {name = "The Tari Development Community", email = "dev@tari.com"}
]
readme = "README.md"
license = {text = "BSD-3-Clause"}
homepage = "https://tari.com"
repository = "https://github.com/tari-project/tari"
keywords = ["tari", "cryptocurrency", "wallet", "nextnet", "staging", "blockchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
]
requires-python = ">=3.8"
dependencies = [
    "tari-wallet-core>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-asyncio>=0.18.0",
]

[project.urls]
"Bug Reports" = "https://github.com/tari-project/tari/issues"
"Source" = "https://github.com/tari-project/tari"
"Documentation" = "https://tari.com/docs"
"Nextnet Info" = "https://tari.com/nextnet"

[tool.setuptools.packages.find]
where = ["."]
include = ["tari_wallet_nextnet*"]

[tool.setuptools.package-data]
"tari_wallet_nextnet" = ["*.md", "*.txt"]
