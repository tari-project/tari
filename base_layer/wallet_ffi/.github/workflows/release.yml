name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  TARI_TARGET_NETWORK: nextnet

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    
    - name: Install maturin
      run: pip install maturin
    
    - name: Build wheels
      run: |
        cd base_layer/wallet_ffi
        maturin build --release --features python-bindings --out dist
        
    - name: Upload wheels
      uses: actions/upload-artifact@v3
      with:
        name: wheels-${{ matrix.os }}
        path: base_layer/wallet_ffi/dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
    
    - name: Install maturin
      run: pip install maturin
    
    - name: Build source distribution
      run: |
        cd base_layer/wallet_ffi
        maturin sdist --out dist
        
    - name: Upload source distribution
      uses: actions/upload-artifact@v3
      with:
        name: sdist
        path: base_layer/wallet_ffi/dist/*.tar.gz

  test-wheels:
    name: Test wheels
    needs: [build-wheels, build-sdist]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Download wheels
      uses: actions/download-artifact@v3
      with:
        name: wheels-${{ matrix.os }}
        path: dist/
    
    - name: Install wheel
      run: |
        pip install --find-links dist/ tari-wallet
        
    - name: Test installation
      run: |
        python -c "import tari_wallet; print('Import successful')"
        cd base_layer/wallet_ffi
        python -m pytest tests/test_basic_setup.py -v

  github-release:
    name: Create GitHub Release
    needs: [test-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: dist/
        
    - name: Flatten artifacts
      run: |
        mkdir -p release-artifacts
        find dist/ -name "*.whl" -exec cp {} release-artifacts/ \;
        find dist/ -name "*.tar.gz" -exec cp {} release-artifacts/ \;
        
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: release-artifacts/*
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, '-') }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi-release:
    name: Publish to PyPI
    needs: [test-wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    environment: pypi
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: dist/
        
    - name: Flatten artifacts
      run: |
        mkdir -p pypi-artifacts
        find dist/ -name "*.whl" -exec cp {} pypi-artifacts/ \;
        find dist/ -name "*.tar.gz" -exec cp {} pypi-artifacts/ \;
        
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: pypi-artifacts/
        password: ${{ secrets.PYPI_API_TOKEN }}
        skip-existing: true
