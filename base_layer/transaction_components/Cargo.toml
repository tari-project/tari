[package]
name = "tari_transaction_components"
description = "Core Tari transaction components"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
ledger = ["minotari_ledger_wallet_comms"]
wasm = ["wasm-bindgen"]

[dependencies]
minotari_ledger_wallet_comms = { workspace = true, optional = true }
tari_common = { workspace = true }
tari_common_types = { workspace = true }
tari_hashing = { workspace = true }
tari_max_size = { workspace = true }
tari_mmr = { workspace = true }
tari_sidechain = { workspace = true }
tari_script = { workspace = true }
tari_utilities = { workspace = true }
minotari_ledger_wallet_common = { workspace = true, features = ["borsh"] }

anyhow = { workspace = true }
base64 = { workspace = true }
bitflags = { version = "2.4", features = ["serde"] }
borsh = { workspace = true, features = ["derive"] }

bytes = "1.11.1"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4", default-features = false, features = ["serde", "now"] }

derivative = "2.2.0"
decimal-rs = "0.1.42"
digest = "0.10"

integer-encoding = "3.0"
num-format = "0.4.0"
newtype-ops = "0.1.4"
num-traits = "0.2.15"
num-derive = "0.4.2"

primitive-types = { version = "0.12", features = ["serde"] }
log = { workspace = true }
rand = { workspace = true }
serde_repr = "0.1.8"
serde_valid = "2"
strum_macros = "0.22"
tari_crypto = { workspace = true, features = ["borsh"] }

thiserror = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
blake2 = "0.10"
semver = { version = "1.0", features = ["serde"] }
uuid = "1.17.0"
zeroize = "1"

utoipa = "5.3.1"
wasm-bindgen = { version = "0.2.100", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
chrono = { version = "0.4", features = ["serde", "wasmbind"] }

[dev-dependencies]
argon2 = "0.6.0-rc.8"
chrono = { version = "0.4", default-features = false, features = ["serde"] }
tari_test_utils = { workspace = true }
hex = "0.4"
toml = "0.5.8"

serde_json = "1.0"
static_assertions = "1.1.0"

# The Speculos harness, for `tests/ledger_key_manager` and nothing else. Read this before touching it.
#
# `minotari_ledger_wallet_comms_testing` enables `minotari_ledger_wallet_comms/test_transport`, the registry that
# lets a caller redirect the Ledger device connection, and it is `exclude`d from the root workspace so that feature
# can never be unified into the `comms` rlib a shipped binary links - see the comment on `[workspace] exclude` in
# the root `Cargo.toml`. A plain dev-dependency here would put that feature back into every `cargo test --workspace`
# and every `--all-targets` build, and would make the documented leak check
# (`cargo tree -e features -i minotari_ledger_wallet_comms | grep test_transport`) print a line.
#
# So it is gated twice:
#
# * It is a **dev**-dependency, so no non-test build can reach it under any flags - `cargo build --bin ...`, the
#   release build, never resolves dev-dependencies at all.
# * It sits behind `cfg(tari_ledger_speculos)`, a custom cfg that nothing sets except `scripts/ledger_speculos.sh`
#   (through `RUSTFLAGS`, into a target directory of its own). Cargo evaluates a `[target.'cfg(..)']` table against
#   `rustc --print cfg` with the same `RUSTFLAGS`, so without the flag this table does not exist and no test or lint
#   build - `cargo ci-test` and `cargo ci-clippy` included - ever resolves the harness. (Those two do compile
#   `comms` with `test_transport`, because their `--all-features` names it directly; that predates this table, has
#   nothing to do with it, and neither of them builds a shipped binary.)
#
# A cargo feature cannot do the second job: `cargo ci-test` runs with `--all-features`, which would switch it on in
# every CI run with no simulator to talk to.
#
# `ledger-transport` is here for the one type the test harness has to name - `APDUCommand`, in the signature of the
# `LedgerTransport` wrapper that watches and interleaves exchanges - and for no other reason.
[target.'cfg(tari_ledger_speculos)'.dev-dependencies]
minotari_ledger_wallet_comms_testing = { path = "../../applications/minotari_ledger_wallet/comms_testing" }
ledger-transport = { version = "0.11" }

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(tari_target_network_mainnet)',
    'cfg(tari_target_network_nextnet)',
    'cfg(tari_target_network_testnet)',
    # Set only by `scripts/ledger_speculos.sh`; see the `cfg(tari_ledger_speculos)` dev-dependencies above.
    'cfg(tari_ledger_speculos)',
] }



[package.metadata.cargo-machete]
ignored = ["hickory-proto"]
