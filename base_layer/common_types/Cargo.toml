[package]
name = "tari_common_types"
description = "Tari cryptocurrency common types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = []
wasm = ["wasm-bindgen"]

[dependencies]
tari_crypto = { workspace = true }
tari_common = { workspace = true }
tari_hashing = { workspace = true }
tari_max_size = { workspace = true }
tari_utilities = { workspace = true }
# TODO: This is mainly to reference the Branch structure. This should be moved to a crate that does not
# reference ledger, or at least does not have ledger in the name.
minotari_ledger_wallet_common = { workspace = true}


argon2 = { version = "0.4.1", features = ["std", "alloc"] }
base64 = "0.21.0"
blake2 = "0.10"
bitflags = { version = "2.4", features = ["serde"] }
bs58 = "0.5.1"
borsh = "1.5.7"
chacha20 = "0.7.1"
chacha20poly1305 = "0.10.1"
crc32fast = "1.2.1"
digest = "0.10"
newtype-ops = "0.1"
once_cell = "1.8.0"
rand = "0.8"
serde = { version = "1.0.106", features = ["derive"] }
strum = "0.22"
strum_macros = "0.22"
thiserror = "1.0.29"
primitive-types = { version = "0.12", features = ["serde"] }
utoipa = "5.3.1"
wasm-bindgen = { version = "0.2.100", optional = true }
zeroize = "1"

serde_json.workspace = true

subtle = "2.4.1"
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
js-sys = { version = "0.3.55" }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }


[lib]
crate-type = ["cdylib", "rlib"]


[package.metadata.cargo-machete]
ignored = [
    "strum",
    "strum_macros",
] # this is so we can run cargo machete without getting false positive about macro dependancies
