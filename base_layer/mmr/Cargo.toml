[package]
name = "tari_mmr"
description = "A Merkle Mountain Range implementation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
default = []

[dependencies]
tari_utilities = { workspace = true }
tari_crypto = { workspace = true }
thiserror = { workspace = true }
borsh = { workspace = true }
digest = "0.10"
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
rand = { workspace = true }
blake2 = "0.10"
serde_json = "1.0"
bincode = "1.1"
criterion = { version = "0.8" }

[lib]
# Disable libtest from intercepting Criterion bench arguments
bench = false

[[bench]]
name = "mmr"
harness = false

[[bench]]
name = "smt"
harness = false


[[test]]
name = "tari_mmr_integration_tests"
path = "tests/mmr_integration_tests.rs"
