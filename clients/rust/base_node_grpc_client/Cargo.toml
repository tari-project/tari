[package]
name = "minotari_node_grpc_client"
description = "Base node GRPC client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
homepage = "https://tari.com"
readme = "README.md"
license.workspace = true

[dependencies]
minotari_app_grpc = { workspace = true }
tari_common = { workspace = true }
tari_common_types = { workspace = true }

log = { workspace = true }
thiserror = { workspace = true }
tonic = { version = "0.13.1", default-features = false, features = ["codegen", "transport", "tls-ring", "tls-native-roots"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"] }
tonic = { version = "0.13.1", default-features = false, features = ["prost", "router", "server"] }
