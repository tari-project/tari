---
name: "CI"

"on":
  workflow_dispatch:
  push:
    branches:
      - "ci-*"
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  merge_group:

permissions: {}

env:
  toolchain: stable
  toolchain_msrv_reject_older: 1.93.0
  nightly_toolchain: nightly-2026-06-01
  CARGO_HTTP_MULTIPLEXING: false
  CARGO_TERM_COLOR: always
  CARGO_UNSTABLE_SPARSE_REGISTRY: true
  CARGO_INCREMENTAL: 0
  RUSTUP_PERMIT_COPY_RENAME: true
  PROTOC: protoc
  TERM: unknown
  ## Must be a JSon string
  TS_FEATURES: '["default","safe","grpc","ledger","libtor","metrics","miner_input"]'

concurrency:
  # https://docs.github.com/en/actions/examples/using-concurrency-expressions-and-a-test-matrix
  group: "${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') || github.ref != 'refs/heads/development' || github.ref != 'refs/heads/nextnet' || github.ref != 'refs/heads/stagenet' }}

jobs:
  ci:
    name: ci
    runs-on: [ubuntu-latest]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.toolchain }}
          components: clippy
      - name: ubuntu dependencies
        run: |
          # The ubuntu-24.04 runner image ships a HashiCorp apt source whose signing key is
          # missing (NO_PUBKEY FC9CA96ACA026560), which makes `apt-get update` exit 100.
          sudo rm -f /etc/apt/sources.list.d/*hashicorp*
          sudo apt-get update
          sudo bash scripts/install_ubuntu_dependencies.sh
      - name: Cache cargo files and outputs
        if: startsWith(runner.environment,'github-hosted')
        uses: Swatinem/rust-cache@v2
      - name: caching (nightly)
        if: startsWith(runner.environment,'self-hosted')
        # Don't use rust-cache.
        # Rust-cache disables a key feature of actions/cache: restoreKeys.
        # Without restore keys, we lose the ability to get partial matches on caches, and end
        # up with too many cache misses.
        # Use a "small" suffix to use the build caches where possible, but build caches won't use this
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/CACHEDIR.TAG
            ~/.cargo/git
            target
          key: tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.nightly_toolchain }}-nightly-${{ hashFiles('**/Cargo.lock') }}-small
          restore-keys: |
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.nightly_toolchain }}-nightly-${{ hashFiles('**/Cargo.lock') }}-small
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.nightly_toolchain }}-nightly-${{ hashFiles('**/Cargo.lock') }}
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.nightly_toolchain }}-nightly
      - name: Install cargo-lints
        run: cargo install cargo-lints
      - name: Clippy check (with lints)
        run: |
          rustup component add --toolchain stable-x86_64-unknown-linux-gnu clippy
          cargo lints clippy --all-targets --all-features
      - name: cargo machete
        run: |
          cargo install cargo-machete@0.7.0
          cargo machete
      # `minotari_ledger_wallet_comms_testing` is its own workspace and is deliberately `exclude`d from the root
      # one - see the comment on `[workspace] exclude` in the root Cargo.toml, which is a security property, not a
      # packaging accident. The consequence is that no other job in this file compiles or runs a line of it.
      #
      # This step is a *minimal* guard, and it is here because a change to the shipped device firmware
      # (`wallet/src/main.rs`, `common/src/common_types.rs`) landed alongside that crate's tests and nothing else
      # would notice it regressing. Every test that needs a device is `#[ignore]`d, so this needs no Docker and no
      # simulator and finishes in a couple of seconds.
      #
      # It is deliberately NOT the Speculos job. Building the `.elf` and running the suite against an emulator -
      # `./scripts/ledger_speculos.sh test` - is the `ledger speculos tests` job in .github/workflows/ledger_tests.yml,
      # with its own timeout and artifact uploads.
      - name: ledger comms_testing unit tests
        run: cargo test --locked --manifest-path applications/minotari_ledger_wallet/comms_testing/Cargo.toml
      - name: cargo vet
        # Disable cargo vet
        if: ${{ false }}
        run: |
          cargo install cargo-vet@0.10.0 --locked
          cargo vet
      - name: Install nightly with rustfmt
        run: rustup toolchain install ${{ env.nightly_toolchain }} --component rustfmt
      - name: cargo format
        run: cargo +${{ env.nightly_toolchain }} fmt --all -- --check

  ledger-build-tests:
    name: ledger build tests
    runs-on: [ubuntu-latest]
    timeout-minutes: 30
    steps:
      - name: checkout tari
        uses: actions/checkout@v7

      # Restore only - this job never saves. The one writer of this cache is the `ledger speculos tests` job in
      # .github/workflows/ledger_tests.yml, on pushes to `development`, and the key below must stay byte for byte the
      # same as the one there. Why:
      #
      # * A cache saved from a pull request is visible to that pull request only, and one saved from a merge queue
      #   ref to nobody else at all; only `development`'s are visible to every PR. This workflow never runs on a push
      #   to `development`, so anything it saved would be seen by one PR at most while spending the repository's
      #   shared 10 GB cache quota, which Tari already runs at the limit.
      # * Both jobs build the same crate with the same toolchain, into the same target directory, so one entry
      #   serves both. The writer builds all four models on `development` precisely so that this job's flex and
      #   nanox builds are warm too.
      #
      # `cargo-home/registry/src` is left out: it is the unpacked copy of `registry/cache`, which cargo re-extracts
      # offline in seconds, and it is about half the cache by size.
      #
      # Ownership: the builder runs as the runner's own uid (see `cmd_build` in scripts/ledger_speculos.sh), so
      # nothing in these paths is root-owned - which is what lets a later `actions/cache/save` read them and a
      # restored cache be written over by the next build.
      - name: restore ledger build cache
        uses: actions/cache/restore@v6
        with:
          path: |
            applications/minotari_ledger_wallet/wallet/target
            !applications/minotari_ledger_wallet/wallet/target/cargo-home/registry/src
          key: ledger-wallet-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('applications/minotari_ledger_wallet/wallet/Cargo.lock', 'applications/minotari_ledger_wallet/wallet/rust-toolchain.toml') }}
          restore-keys: |
            ledger-wallet-${{ runner.os }}-${{ runner.arch }}-

      # Built through scripts/ledger_speculos.sh so that this job, the Speculos job and a developer's machine run the
      # same `docker run`: the builder image pinned by digest, run as the invoking user rather than root, with
      # CARGO_HOME inside the cached target directory, and `cargo ledger build <model> -- --locked`.
      - name: ledger build tests
        shell: bash
        run: ./scripts/ledger_speculos.sh build stax flex nanosplus nanox

  wasm-build-tests:
    name: wasm build tests

    runs-on: [ubuntu-latest]

    steps:
      - name: checkout tari
        uses: actions/checkout@v7

      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: ubuntu dependencies
        run: |
          # The ubuntu-24.04 runner image ships a HashiCorp apt source whose signing key is
          # missing (NO_PUBKEY FC9CA96ACA026560), which makes `apt-get update` exit 100.
          sudo rm -f /etc/apt/sources.list.d/*hashicorp*
          sudo apt-get update
          sudo bash scripts/install_ubuntu_dependencies.sh

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache cargo files and outputs
        if: startsWith(runner.environment,'github-hosted')
        uses: Swatinem/rust-cache@v2

      - name: caching
        if: startsWith(runner.environment,'self-hosted')
        # Don't use rust-cache.
        # Rust-cache disables a key feature of actions/cache: restoreKeys.
        # Without restore keys, we lose the ability to get partial matches on caches, and end
        # up with too many cache misses.
        # Use a "small" suffix to use the build caches where possible, but build caches won't use this
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/CACHEDIR.TAG
            ~/.cargo/git
            target
          key: tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-stable-${{ hashFiles('**/Cargo.lock') }}-small
          restore-keys: |
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-stable-${{ hashFiles('**/Cargo.lock') }}-small
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-stable-${{ hashFiles('**/Cargo.lock') }}
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-stable
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}

      - name: wasm build tests
        shell: bash
        run: |
          wasm-pack build base_layer/node_components --target web
          wasm-pack build base_layer/common_types --target web
          wasm-pack build base_layer/transaction_components --target web

  build-stable:
    # Runs cargo check with stable toolchain to determine whether the codebase is likely to build
    #  on stable Rust.
    name: cargo check with ${{ matrix.rust }}
    runs-on: [self-hosted, ubuntu-high-cpu]
    # fail jobs unless - msrv-reject-older
    continue-on-error: ${{ startsWith(matrix.rust, 'msrv-reject-older') || false }}
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - msrv
          # - msrv_reject_older

    env:
      RUSTUP_PERMIT_COPY_RENAME: true

    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Cache cargo files and outputs
        if: startsWith(runner.environment,'github-hosted')
        uses: Swatinem/rust-cache@v2
      - name: caching (stable)
        if: startsWith(runner.environment,'self-hosted')
        # Don't use rust-cache.
        # Rust-cache disables a key feature of actions/cache: restoreKeys.
        # Without restore keys, we lose the ability to get partial matches on caches, and end
        # up with too many cache misses.
        # This job runs on self-hosted, so use local-cache instead.
        uses: maxnowack/local-cache@v3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/CACHEDIR.TAG
            ~/.cargo/git
            target
          key: tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-stable-${{ hashFiles('**/Cargo.lock') }}-small
          restore-keys: |
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-stable-${{ hashFiles('**/Cargo.lock') }}-small
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-stable-${{ hashFiles('**/Cargo.lock') }}
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-stable
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}

      - name: Extract MSRV from env/Cargo.toml
        id: msrv
        if: startsWith(matrix.rust,'msrv')
        run: |
          if [[ "${{ matrix.rust }}" == 'msrv' ]]; then
            version=$(grep -m1 '^rust-version' Cargo.toml | sed 's/[^0-9.]//g')
          else
            version=${{ env.toolchain_msrv_reject_older }}
          fi
          echo "version=$version" >> $GITHUB_OUTPUT
          # Temporary disable toolchain pinning
          rm -vf rust-toolchain.toml

      # Stable toolchain
      - name: Set up Rust (stable)
        if: matrix.rust == 'stable'
        uses: dtolnay/rust-toolchain@stable

      # MSRV toolchain
      - name: Set up Rust (${{ matrix.rust }}-${{ steps.msrv.outputs.version }})
        if: startsWith(matrix.rust,'msrv')
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: ubuntu dependencies
        run: |
          # The ubuntu-24.04 runner image ships a HashiCorp apt source whose signing key is
          # missing (NO_PUBKEY FC9CA96ACA026560), which makes `apt-get update` exit 100.
          sudo rm -f /etc/apt/sources.list.d/*hashicorp*
          sudo apt-get update
          sudo bash scripts/install_ubuntu_dependencies.sh

      - name: rustup show
        run: rustup show

      - name: cargo check
        run: cargo check --release --all-targets --workspace --exclude tari_integration_tests --locked

      - name: cargo check individual features
        shell: bash
        run: |
          FEATURES_ARRAY=( $(echo ${TS_FEATURES} | jq --raw-output '.[]' | awk '{ print $1 }') )
          for FEATURE_TEST in "${FEATURES_ARRAY[@]}"; do
            echo "Testing for feature ${FEATURE_TEST} ..."
            cargo check --release --all-targets \
              --features ${FEATURE_TEST} \
              --workspace --exclude tari_integration_tests --locked
          done

      - name: cargo check wallet ffi separately
        run: cargo check --release --package minotari_wallet_ffi --locked

  licenses:
    name: file licenses
    runs-on: [ubuntu-latest]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: install ripgrep
        run: |
          #wget https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep_14.1.0-1_amd64.deb.sha256
          wget https://github.com/BurntSushi/ripgrep/releases/download/14.1.0/ripgrep_14.1.0-1_amd64.deb
          sudo dpkg -i ripgrep_14.1.0-1_amd64.deb
          rg --version || exit 1
      - name: run the license check
        run: ./scripts/file_license_check.sh

  # Unlike the `test` job, this one must pass: it fails when a type's serde, borsh and protobuf decoders stop
  # accepting the same values (see scripts/decoder_parity_check.py and
  # applications/minotari_app_grpc/tests/decoder_parity.rs).
  decoder-parity:
    name: decoder parity
    # GitHub-hosted, with the same dependency setup as the `ci` job
    runs-on: [ubuntu-latest]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: check that no type with a validating constructor derives its serde or borsh decoder, and the node ingress rules
        run: |
          python3 ./scripts/decoder_parity_check.py --self-test
          python3 ./scripts/decoder_parity_check.py
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.toolchain }}
      - name: ubuntu dependencies
        run: |
          sudo apt-get update
          sudo bash scripts/install_ubuntu_dependencies.sh
      - name: Cache cargo files and outputs
        uses: Swatinem/rust-cache@v2
      - name: cross-family decoder parity (serde_json, bincode, borsh, P2P proto, gRPC proto)
        run: ./scripts/cargo_test_ran_tests.sh cargo +${{ env.toolchain }} test --locked --all-features -p minotari_app_grpc --test decoder_parity
      - name: ValidatedDecode tests
        run: ./scripts/cargo_test_ran_tests.sh cargo +${{ env.toolchain }} test --locked --all-features -p tari_max_size --lib -- validated_decode
      - name: TariScript and ExecutionStack decoder tests
        run: >-
          ./scripts/cargo_test_ran_tests.sh cargo +${{ env.toolchain }} test --locked --all-features -p tari_script --lib -- stack:: script::
      - name: TariAddress decoder tests
        run: ./scripts/cargo_test_ran_tests.sh cargo +${{ env.toolchain }} test --locked --all-features -p tari_common_types --lib -- tari_address
      - name: MemoField, EncryptedData, KernelFeatures, Covenant, AggregateBody, Difficulty and TariKeyId decoder tests
        run: >-
          ./scripts/cargo_test_ran_tests.sh cargo +${{ env.toolchain }} test --locked --all-features -p tari_transaction_components --lib --
          memo_field encrypted_data kernel_features covenants aggregated_body tari_proof_of_work::difficulty
          key_manager::key_id
      - name: Legacy wallet records with oversized memos still load
        run: >-
          ./scripts/cargo_test_ran_tests.sh cargo +${{ env.toolchain }} test --locked --all-features -p minotari_wallet --lib --
          legacy_transaction_protocol
      - name: Imported wallet transactions get the same status check as new ones; legacy key ids still load
        run: >-
          ./scripts/cargo_test_ran_tests.sh cargo +${{ env.toolchain }} test --locked --all-features -p minotari_wallet --test wallet_integration_tests --
          import_transaction_rejects_the_coinbase_status test_legacy_derived_spend_key_reads_migrates_and_reads_again
      - name: Node submit paths decode through the P2P proto
        run: >-
          ./scripts/cargo_test_ran_tests.sh cargo +${{ env.toolchain }} test --locked --all-features -p minotari_node --lib --
          grpc::base_node_grpc_server::test http::handler::json_rpc

  test:
    name: test
    runs-on: [self-hosted, ubuntu-high-cpu]
    permissions:
      checks: write
      pull-requests: write
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        tari_target_network:
          [
            { target: "testnet", network: "esmeralda" },
            { target: "nextnet", network: "nextnet" },
            { target: "mainnet", network: "stagenet" },
          ]
    env:
      TARI_TARGET_NETWORK: ${{ matrix.tari_target_network.target }}
      TARI_NETWORK: ${{ matrix.tari_target_network.network }}
      RUST_LOG: debug
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.toolchain }}
      - name: ubuntu dependencies
        run: |
          # The ubuntu-24.04 runner image ships a HashiCorp apt source whose signing key is
          # missing (NO_PUBKEY FC9CA96ACA026560), which makes `apt-get update` exit 100.
          sudo rm -f /etc/apt/sources.list.d/*hashicorp*
          sudo apt-get update
          sudo bash scripts/install_ubuntu_dependencies.sh
      - name: Cache cargo files and outputs
        if: startsWith(runner.environment,'github-hosted')
        uses: Swatinem/rust-cache@v2
      - name: caching (stable)
        if: startsWith(runner.environment,'self-hosted')
        # Don't use rust-cache.
        # Rust-cache disables a key feature of actions/cache: restoreKeys.
        # Without restore keys, we lose the ability to get partial matches on caches, and end
        # up with too many cache misses.
        # This job runs on self-hosted, so use local-cache instead.
        uses: maxnowack/local-cache@v3
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/CACHEDIR.TAG
            ~/.cargo/git
            target
          key: tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-stable-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.tari_target_network.target }}
          restore-keys: |
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-stable-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.tari_target_network.network }}
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-stable-${{ hashFiles('**/Cargo.lock') }}
            tari-${{ runner.os }}-${{ runner.cpu-model }}-${{ env.toolchain }}-stable
      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked --force
      - name: cargo test compile
        run: cargo +${{ env.toolchain }} test -vv --no-run --locked --all-features --release
      - name: cargo test
        run: cargo +${{ env.toolchain }} nextest run --all-features --release -E "not package(tari_integration_tests)" --profile ci --no-fail-fast
      - name: upload artifact
        uses: actions/upload-artifact@v7 # upload test results as artifact
        if: always()
        with:
          name: test-results-${{ matrix.tari_target_network.target }}.${{ matrix.tari_target_network.network }}
          path: ${{ github.workspace }}/target/nextest/ci/junit.xml

  # Allows other workflows to know the PR number
  artifacts:
    name: pr_2_artifact
    runs-on: [ubuntu-latest]
    steps:
      - name: Save the PR number in an artifact
        shell: bash
        env:
          PR_NUM: ${{ github.event.number }}
        run: echo $PR_NUM > pr_num.txt

      - name: Upload the PR number
        uses: actions/upload-artifact@v7
        with:
          name: pr_num
          path: ./pr_num.txt

  # needed for test results
  event_file:
    name: "Upload Event File for Test Results"
    runs-on: [ubuntu-latest]
    steps:
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: Event File
          path: ${{ github.event_path }}
