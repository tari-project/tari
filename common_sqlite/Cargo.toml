[package]
name = "tari_common_sqlite"
description = "Tari cryptocurrency wallet library"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[features]
bundled = ["libsqlite3-sys/bundled"]

[dependencies]
tari_utilities = { workspace = true }

diesel = { version = "2.2.10", features = [
    "sqlite",
    "r2d2",
    "serde_json",
    "chrono",
    "64-column-tables",
] }
diesel_migrations = "2.2"
log = "0.4.6"
rand = "0.8"
serde = "1.0.90"
serde_json = "1.0.133"
thiserror = "1.0.26"
tokio = { version = "1.44", features = ["sync", "macros", "rt"] }
lazy_static = "1.5.0"
libsqlite3-sys = { version = "0.25.1", optional = true }

[dev-dependencies]


[package.metadata.cargo-machete]
ignored = ["libsqlite3-sys"]
