[package]
name = "tari_comms"
description = "A peer-to-peer messaging system"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
tari_crypto = { workspace = true }
tari_common_sqlite = { workspace = true }
tari_metrics = { workspace = true, optional = true }
tari_storage = { workspace = true }
tari_shutdown = { workspace = true }
tari_utilities = { workspace = true }

anyhow = { workspace = true }
async-trait = "0.1.36"
bitflags = { version = "2.4", features = ["serde"] }
blake2 = "0.10"
bytes = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = [
    "serde",
    "clock",
] }
cidr = "0.1.0"
data-encoding = "2.2.0"
derivative = "2.2.0"
diesel = { version = "2.3.10", features = [
    "sqlite",
    "serde_json",
    "chrono",
    "numeric",
] }
diesel_migrations = "2.3"
digest = "0.10"
futures = { version = "^0.3", features = ["async-await"] }
log = { workspace = true, features = ["std"] }
multiaddr = { version = "0.18.2" }
nom = { version = "7.1", features = ["std"], default-features = false }
once_cell = "1.8.0"
pin-project = "1.0.8"
prost = "0.13.3"
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_derive = "1.0.119"
sha3 = "0.10"
snow = { version = "0.9.5", features = ["default-resolver"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "time",
    "sync",
    "signal",
    "net",
    "macros",
    "io-util",
] }
tokio-stream = { version = "0.1.9", features = ["sync"] }
tokio-util = { version = "0.6.7", features = ["codec", "compat"] }
tower = { version = "0.4", features = ["util"] }
tracing = "0.1.26"
yamux = "0.13.10"
zeroize = "1"
local-ip-address = "0.6.5"

[dev-dependencies]
tari_test_utils = { workspace = true }
tari_comms_rpc_macros = { workspace = true }
toml = { version = "0.5" }
# `test-util` enables tokio's paused clock, used by tests that must assert on timeout behaviour
# without paying for the timeouts in wall-clock time.
tokio = { workspace = true, features = ["test-util"] }

env_logger = "0.11"
# Used by `no_peer_manager_method_performs_synchronous_storage_io` to parse the peer manager sources
# rather than pattern-match them. Already in the lockfile as a transitive proc-macro dependency.
syn = { version = "2.0.118", features = ["full", "visit"] }
tempfile = "3.1.0"

[build-dependencies]
tari_common = { workspace = true, features = ["build"] }

[features]
c_integration = []
metrics = ["tari_metrics"]
rpc = ["tower/make", "tower/util"]
