# Log configuration for minotari_xmrig_proxy
refresh_rate: 30 seconds
appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d(%H:%M)} {h({l}):5} {m}{n}"
    filters:
      - kind: threshold
        level: info

  proxy:
    kind: rolling_file
    path: "{{log_dir}}/log/xmrig_proxy/proxy.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 10mb
      roller:
        kind: fixed_window
        base: 1
        count: 50
        pattern: "{{log_dir}}/log/xmrig_proxy/proxy.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} [{t}] {l:5} {m} //{f}:{L}{n}"

root:
  level: info
  appenders:
    - stdout
    - proxy

loggers:
  h2:
    level: info
    appenders:
      - stdout
      - proxy
    additive: false
  hyper:
    level: info
    appenders:
      - stdout
      - proxy
    additive: false
