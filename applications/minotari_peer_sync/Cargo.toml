[package]
name = "minotari_peer_sync"
description = "Runs the base node peer sync (seed strap) and dials every discovered peer, reporting how many could be reached"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "minotari_peer_sync"
path = "src/main.rs"

[dependencies]
minotari_app_utilities = { workspace = true }
tari_common = { workspace = true }
tari_comms = { workspace = true, features = ["rpc"] }
tari_comms_dht = { workspace = true }
tari_libtor = { workspace = true, optional = true }
tari_p2p = { workspace = true }
tari_service_framework = { workspace = true }
tari_shutdown = { workspace = true }
tari_utilities = { workspace = true }

clap = { version = "4", features = ["derive", "env"] }
config = { version = "0.14.0" }
futures = { version = "^0.3.16", default-features = false, features = ["alloc"] }
log = { workspace = true, features = ["std"] }
log4rs = { workspace = true, default-features = false, features = [
    "config_parsing",
    "threshold_filter",
    "yaml_format",
    "console_appender",
    "rolling_file_appender",
    "compound_policy",
    "size_trigger",
    "fixed_window_roller",
] }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }

[features]
default = ["libtor"]
# Run a bundled tor instance (unix only) instead of requiring an already-running tor
libtor = ["tari_libtor"]

[build-dependencies]
tari_features = { workspace = true }

[package.metadata.cargo-machete]
ignored = [
    # We need to specify extra features for log4rs even though it is not used directly in this crate
    "log4rs",
]
