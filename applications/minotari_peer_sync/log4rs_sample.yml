# Log configuration for the peer sync tool. The console only shows warnings and errors (the tool prints its own
# progress and report to stdout); the detail of the peer sync and of every dial lands in log/peer_sync/*.log.
refresh_rate: 30 seconds
appenders:
  stdout:
    kind: console
    encoder:
      pattern: "{d(%H:%M)} {h({l}):5} {m}{n}"
    filters:
      - kind: threshold
        level: warn

  # Comms and DHT logs - this is where the peer sync and dial detail is
  network:
    kind: rolling_file
    path: "{{log_dir}}/log/peer_sync/network.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 10mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/peer_sync/network.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} [{t}] [Thread:{I}] {l:5} {m} // {f}:{L}{n}"

  # This application's own logs
  application:
    kind: rolling_file
    path: "{{log_dir}}/log/peer_sync/peer_sync.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 10mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/peer_sync/peer_sync.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} [{t}] {l:5} {m} // {f}:{L}{n}"

  # Everything else
  other:
    kind: rolling_file
    path: "{{log_dir}}/log/peer_sync/other.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 10mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/peer_sync/other.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} [{t}] {l:5} {m} // {f}:{L}{n}"

root:
  level: warn
  appenders:
    - stdout

loggers:
  tari::application:
    level: debug
    appenders:
      - application
    additive: false

  minotari:
    level: debug
    appenders:
      - application
    additive: false

  # `additive: false` keeps these off the console: the tool's own output and report are what belongs on stdout, and
  # a run that abandons slow dials produces a steady stream of comms warnings that would otherwise bury it. The full
  # detail is in network.log.
  comms:
    level: debug
    appenders:
      - network
    additive: false

  p2p:
    level: debug
    appenders:
      - network
    additive: false

  yamux:
    level: info
    appenders:
      - network
    additive: false

  mio:
    level: error
    appenders:
      - other

  tokio_util:
    level: error
    appenders:
      - other

  r2d2:
    level: warn
    appenders:
      - other
    additive: false

  comms::middleware::message_logging:
    level: warn
    appenders:
      - other
