[package]
name = "minotari_mcp_node"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lints.clippy]
# Allow certain lints for this crate to focus on functionality over style
too_many_lines = "allow"
if_not_else = "allow"
cast_possible_truncation = "allow"
struct_excessive_bools = "allow"

[lints.rust]
let_underscore_drop = "allow"

[[bin]]
name = "minotari_mcp_node"
path = "src/main.rs"

[dependencies]
minotari_mcp_common = { workspace = true }
minotari_app_utilities = { workspace = true }
minotari_app_grpc = { workspace = true }
minotari_node_grpc_client = { workspace = true }
tari_common = { workspace = true }
tari_core = { workspace = true, features = ["transactions", "base_node_proto", "base_node"] }
tari_utilities = { workspace = true }
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "3.2", features = ["derive", "env"] }
log = "0.4"
async-trait = "0.1"
tonic = { version = "0.13.1", default-features = false, features = ["codegen", "transport", "tls-ring"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
dirs = "5.0"
which = "4.0"
