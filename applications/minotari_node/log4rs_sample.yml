# A sample log configuration file for running in release mode. By default, this configuration splits up log messages to
# three destinations:
#    * Console: For log messages with level INFO and higher
#    * log/base-node/network.log: INFO-level logs related to the comms crate. This file will be quite busy since there
#      are lots of P2P debug messages, and so this traffic is segregated from the application log messages
#    * log/base-node/base_layer.log: Non-comms related INFO-level messages and higher are logged into this file
#    * log/base-node/other.log: Third-party crates' messages will be logged here at an ERROR level
#
#  See https://docs.rs/log4rs/0.8.3/log4rs/encode/pattern/index.html for deciphering the log pattern. The log format
#  used in this sample configuration prints messages as:
#  timestamp [target] LEVEL message
refresh_rate: 30 seconds
appenders:
  # An appender named "stdout" that writes to stdout
  stdout:
    kind: console
    encoder:
      pattern: "{d(%H:%M)} {h({l}):5} {m}{n}"
    filters:
      - kind: threshold
        level: warn

  # An appender named "network" that writes to a file with a custom pattern encoder
  network:
    kind: rolling_file
    path: "{{log_dir}}/log/base_node/network.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 10mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/base_node/network.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} [{t}] [Thread:{I}] {l:5} {m} // {f}:{L}{n}"

  # An appender named "message_logging" that writes to a file with a custom pattern encoder
  message_logging:
    kind: rolling_file
    path: "{{log_dir}}/log/base_node/messages.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 10mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/base_node/messages.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} [{t}] [Thread:{I}] {l:5} {m} // {f}:{L}{n}"

  # An appender named "base_layer" that writes to a file with a custom pattern encoder
  base_layer:
    kind: rolling_file
    path: "{{log_dir}}/log/base_node/base_layer.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 10mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/base_node/base_layer.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} [{t}] [{X(node-public-key)},{X(node-id)}] {l:5} {m} // {f}:{L}{n}"

  # An appender named "grpc" that writes to a file with a custom pattern encoder
  grpc:
    kind: rolling_file
    path: "{{log_dir}}/log/base_node/grpc.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 10mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/base_node/grpc.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} {l:5} {m} // {f}:{L}{n}"

  # An appender named "other" that writes to a file with a custom pattern encoder
  other:
    kind: rolling_file
    path: "{{log_dir}}/log/base_node/other.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 10mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/base_node/other.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} [{t}] [Thread:{I}] {l:5} {m}{n} // {f}:{L} "

  # An appender named "libp2p" that writes to a file with a custom pattern encoder
  libp2p:
    kind: rolling_file
    path: "{{log_dir}}/log/base_node/libp2p.log"
    policy:
      kind: compound
      trigger:
        kind: size
        limit: 10mb
      roller:
        kind: fixed_window
        base: 1
        count: 5
        pattern: "{{log_dir}}/log/base_node/libp2p.{}.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} [{t}] [Thread:{I}] {l:5} {m}{n} // {f}:{L} "

  # An appender named "fail2ban" that writes to a file with a custom pattern encoder
  fail2ban:
    kind: file
    path: "{{log_dir}}/log/base_node/fail2ban.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S.%f)} [{t}] [Thread:{I}] {l:5} {m}{n}"

# Set the default logging level to "info"
root:
  level: warn
  appenders:
    - stdout

loggers:
  # Route log events common to every application to all appenders
  tari::application:
    level: debug
    appenders:
      - base_layer
      - network
      - other
    additive: false

  minotari::base_node::grpc:
    level: debug
    appenders:
      - grpc

  # base_layer
  c:
    level: debug
    appenders:
      - base_layer
  minotari:
    level: debug
    appenders:
      - base_layer
  wallet:
    level: debug
    appenders:
      - base_layer
  tari_mm_proxy:
    level: info
    appenders:
      - base_layer

  # network
  network:
    level: debug
    appenders:
      - network
  comms:
    level: debug
    appenders:
      - network
  p2p:
    level: debug
    appenders:
      - network

  yamux:
    level: info
    appenders:
      - network
  mio:
    level: error
    appenders:
      - network

  # other
  rustyline:
    level: error
    appenders:
      - other
    additive: false
  tokio_util:
    level: error
    appenders:
      - other
  pgp:
    level: warn
    appenders:
      - other
  r2d2:
    level: warn
    appenders:
      - other
    additive: false

  # message_logging
  comms::middleware::message_logging:
    level: warn # Set to `trace` to retrieve message logging
    appenders:
      - message_logging

  # fail2ban logs
  fail2ban:
    level: info
    appenders:
      - fail2ban
    additive: false

  # libp2p
  libp2p_identify:
    level: debug
    appenders:
      - libp2p
    additive: false
  libp2p_noise:
    level: debug
    appenders:
      - libp2p
    additive: false
  libp2p_peersync:
    level: info
    appenders:
      - libp2p
    additive: false
  libp2p_gossipsub:
    level: info
    appenders:
      - libp2p
    additive: false
  quinn:
    level: info
    appenders:
      - libp2p
    additive: false
  quinn_proto:
    level: info
    appenders:
      - libp2p
    additive: false
  libp2p_core:
    level: info
    appenders:
      - libp2p
    additive: false
  libp2p_mdns:
    level: debug
    appenders:
      - libp2p
    additive: false
  libp2p_swarm:
    level: debug
    appenders:
      - libp2p
    additive: false
  hickory_proto:
    level: info
    appenders:
      - libp2p
    additive: false
  multistream_select:
    level: info
    appenders:
      - libp2p
    additive: false
  libp2p_tcp:
    level: debug
    appenders:
      - libp2p
    additive: false
  libp2p_quic:
    level: debug
    appenders:
