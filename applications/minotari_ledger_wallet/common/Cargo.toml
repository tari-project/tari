[package]
name = "minotari_ledger_wallet_common"
description = "Common utilities and types for the Minotari Ledger Wallet application"
version.workspace = true
edition.workspace = true
#Note: `rust-version` is not specified here as this msut be kept in sync with the ledger-app-builder
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
borsh = { version = "1.5.7", optional = true, features = ["derive"] }
bs58 = { version = "0.5.1", default-features = false, features = ["alloc"] }
serde = { version = "1",  default-features = false, features = ["derive"] }

[features]
borsh = ["dep:borsh"]
# Host conveniences on the wire-format codec (`codec::Encode::to_vec`, and `codec::Writer` for `Vec<u8>`). The device
# application does not enable this: it encodes straight into its APDU buffer, and has no use for code that builds a
# second copy of a reply on the heap.
alloc = []