[package]
name = "minotari_ledger_wallet"
publish = false
version = "6.2.0-pre.0"
authors = ["The Tari Development Community"]
license = "BSD-3-Clause"
edition = "2024"

[dependencies]

minotari_ledger_wallet_common = { path = "../common" }
tari_utilities = { version = "0.8", default-features = false }

blake2 = { version = "0.10", default-features = false }
borsh = { version = "1.5.7", default-features = false }
digest = { version = "0.10", default-features = false }
include_gif = "1.2"
# Pinned exactly: key derivation depends on how this SDK's `make_bip32_path` parses a path. A hardened low word is
# `acc + 0x80000000` in a `u32`, which wraps in a release build (no overflow checks), so a key index whose low word is
# at or above 2^31 lands on a non-hardened path element. See `derive_from_bip32_key` in `src/utils.rs`: a parser
# change, or overflow checks, would change those keys.
ledger_device_sdk = "=1.35.0"
# Pinned: ledger_secure_sdk_sys 1.16.4 compiles the C SDK with -fstack-protector-strong and
# relies on --wrap=__stack_chk_fail in its own device linker specs. The ledger-app-builder
# image used by CI links with its own spec, which has no --wrap, so newlib's real
# __stack_chk_fail is pulled in and drags in unresolvable _exit/_write/_kill/_getpid stubs.
ledger_secure_sdk_sys = "=1.16.3"
rand_core = { version = "0.6.3", default-features = false }
zeroize = { version = "1", default-features = false }
curve25519-dalek = { version = "4", default-features = false, features = [ "alloc", "rand_core", "precomputed-tables", "zeroize"] }
subtle = { version = "2.5.0", default-features = false }

[package.metadata.cargo-machete]
# `ledger_secure_sdk_sys` is not referenced in code; it is declared above purely to pin the
# version resolved for `ledger_device_sdk`'s transitive dependency on it.
ignored = ["ledger_secure_sdk_sys"]

[profile.release]
opt-level = 'z'
lto = true
panic = "abort"

[features]
default = []
pending_review_screen = []

[package.metadata.ledger]
curve = ["secp256k1"]
flags = "0"
path = ["44'/535348'"]
name = "MinoTari Wallet"


[package.metadata.ledger.nanox]
icon = "key_14x14.gif"

[package.metadata.ledger.nanosplus]
icon = "key_14x14.gif"

[package.metadata.ledger.stax]
icon = "key_32x32.gif"

[package.metadata.ledger.flex]
icon = "key_40x40.gif"

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("stax", "flex", "nanos", "nanox", "nanosplus"))'] }