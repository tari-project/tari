[package]
name = "minotari_mcp_wallet"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "minotari_mcp_wallet"
path = "src/main.rs"

[dependencies]
minotari_mcp_common = { workspace = true }
minotari_app_utilities = { workspace = true }
minotari_app_grpc = { workspace = true }
minotari_wallet_grpc_client = { workspace = true }
tari_core = { workspace = true, features = ["transactions", "base_node_proto", "base_node"] }
tari_common = { workspace = true }
tari_utilities = { workspace = true }
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "3.2", features = ["derive", "env"] }
log = "0.4"
async-trait = "0.1"
tonic = { version = "0.13.1", default-features = false, features = ["codegen", "transport", "tls-ring"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
dirs = "5.0"
which = "4.0"
