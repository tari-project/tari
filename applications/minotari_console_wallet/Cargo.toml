[package]
name = "minotari_console_wallet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
minotari_app_grpc = { workspace = true }
minotari_app_utilities = { workspace = true }
minotari_ledger_wallet_comms = { workspace = true, optional = true }
minotari_ledger_wallet_common = { workspace = true }
tari_common = { workspace = true }
tari_common_types = { workspace = true }
tari_transaction_components = { workspace = true }
tari_comms = { workspace = true }
tari_core = { workspace = true }
tari_crypto = { workspace = true }
tari_p2p = { workspace = true, features = ["auto-update"] }
tari_script = { workspace = true }
tari_shutdown = { workspace = true }
tari_transaction_key_manager = { workspace = true }
tari_utilities = { workspace = true }
minotari_wallet = { workspace = true, features = ["bundled_sqlite"] }
minotari_node_wallet_client = { workspace = true }
tari_hashing = { workspace = true }

# Uncomment for tokio tracing via tokio-console (needs "tracing" featurs)
console-subscriber = "0.4"
#tokio = { workspace = true, features = ["signal", "tracing"] }
# Uncomment for normal use (non tokio-console tracing)
tokio = { workspace = true, features = ["signal"] }
anyhow = { workspace = true }
chrono = { version = "0.4", default-features = false }
clap = { version = "3.2", features = ["derive", "env"] }
config = "0.14.0"
crossterm = { version = "0.28" }
dhat = "0.3.3"
digest = "0.10"
dialoguer = { version = "0.10" }
dirs-next = "2.0"
futures = { version = "^0.3.16", default-features = false, features = [
    "alloc",
] }
log = { workspace = true, features = ["std"] }
log4rs = { workspace = true, default-features = false, features = [
    "config_parsing",
    "threshold_filter",
    "yaml_format",
    "console_appender",
    "rolling_file_appender",
    "compound_policy",
    "size_trigger",
    "fixed_window_roller",
    "delete_roller",
] }
qrcode = { version = "0.12" }
rand = { workspace = true }
regex = "1.5.4"
rpassword = "5.0"
rustyline = "9.0"
serde = { workspace = true }
serde_json = "1.0.79"
sha2 = "0.10"
strum = "0.22"
thiserror = { workspace = true }
tonic = "0.13.1"
unicode-width = "0.1"
url = "2.3.1"
zxcvbn = "2"
tui = { version = "^0.19", default-features = false, features = ["crossterm"] }


[dev-dependencies]
tempfile = "3.1.0"

[build-dependencies]
tari_features = { workspace = true }

[features]
default = ["libtor", "ledger", "grpc"]
grpc = []
ledger = ["minotari_ledger_wallet_comms", "minotari_wallet/ledger", "tari_transaction_components/ledger"]
libtor = []
# If you are doing heap profiling, use 'dhat-heap' and enable debug symbols:
#   CARGO_PROFILE_RELEASE_DEBUG=true cargo build --release --bin minotari_console_wallet --features=dhat-heap            ...(Linux)
#   $env:CARGO_PROFILE_RELEASE_DEBUG = "true"; cargo build --release --bin minotari_console_wallet --features=dhat-heap  ...(PowerShell)
dhat-heap = []

[package.metadata.cargo-machete]
# We need to specify extra features for log4rs even though it is not used directly in this crate
ignored = ["strum", "log4rs"]
