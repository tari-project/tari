[package]
name = "minotari_mcp_common"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
minotari_app_utilities = { workspace = true }
tari_common = { workspace = true }
tari_utilities = { workspace = true }
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "3.2", features = ["derive", "env"] }
log = "0.4"
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
regex = "1.10"
unicode-normalization = "0.1"
tonic = { version = "0.13.1", default-features = false, features = ["transport", "tls-ring"] }
prost = "0.13.3"
prost-types = "0.13.3"
minotari_node_grpc_client = { workspace = true }
minotari_wallet_grpc_client = { workspace = true }
which = "5.0"
